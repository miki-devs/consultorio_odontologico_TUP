<form #formPaciente="ngForm" (ngSubmit)="guardar(formPaciente)">
  <label>
    Nombre
    <input type="text" name="nombre" [(ngModel)]="nuevo.nombre" required maxlength="50">
  </label>

  <label>
    Apellido
    <input type="text" name="apellido" [(ngModel)]="nuevo.apellido" required maxlength="50">
  </label>

  <label>
    DNI
    <input type="text" name="dni" [(ngModel)]="nuevo.dni" required maxlength="15" pattern="[0-9]+">
  </label>

  <label>
    Teléfono
    <input type="text" name="telefono" [(ngModel)]="nuevo.telefono" maxlength="20">
  </label>

  <label>
    Historia clínica
    <textarea name="historia_clinica" [(ngModel)]="nuevo.historia_clinica" rows="3"></textarea>
  </label>

  <button type="submit" [disabled]="formPaciente.invalid">Guardar</button>
</form>

@if (mensajeError) {
  <p class="error">{{ mensajeError }}</p>
}

<h2>Pacientes</h2>

<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Apellido</th>
      <th>DNI</th>
      <th>Teléfono</th>
    </tr>
  </thead>
  <tbody>
    @for (paciente of pacientes; track paciente.id) {
      <tr>
        <td>{{ paciente.nombre }}</td>
        <td>{{ paciente.apellido }}</td>
        <td>{{ paciente.dni }}</td>
        <td>{{ paciente.telefono ?? '-' }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">No hay pacientes cargados.</td>
      </tr>
    }
  </tbody>
</table>
